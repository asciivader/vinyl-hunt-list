<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Hunt List</title>
<meta name="description" content="Records I'm hunting for, and the ones I already own.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <h1>Vinyl hunt list</h1>
    <span class="stats" id="stats"></span>
    <span class="spacer"></span>
    <span class="updated" id="updated"></span>
    <a class="btn" href="print.html">Print sheet</a>
  </div>
  <nav class="wrap tabs" aria-label="Views">
    <a href="#wants" data-view="wants">Want list<span class="count" id="want-count"></span></a>
    <a href="#collection" data-view="collection">Collection<span class="count" id="owned-count"></span></a>
  </nav>
</header>

<main class="wrap">
  <section id="wants-view" aria-label="Want list">
    <div class="toolbar">
      <input class="search" id="want-search" type="search" placeholder="Search artists, titles, notes" aria-label="Search the want list">
    </div>
    <div class="chips" id="section-chips" role="group" aria-label="Filter by section"></div>
    <div id="want-list"></div>
  </section>

  <section id="collection-view" aria-label="Collection" hidden>
    <div class="toolbar">
      <input class="search" id="owned-search" type="search" placeholder="Search the collection" aria-label="Search the collection">
      <label class="sort">Sort
        <select id="owned-sort">
          <option value="artist:asc">Artist, A–Z</option>
          <option value="artist:desc">Artist, Z–A</option>
          <option value="year:asc">Year, oldest first</option>
          <option value="year:desc">Year, newest first</option>
          <option value="title:asc">Title, A–Z</option>
          <option value="added:desc">Recently added</option>
          <option value="" disabled hidden>Other column</option>
        </select>
      </label>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><button type="button" data-sort="artist">Artist</button></th>
            <th><button type="button" data-sort="title">Title</button></th>
            <th><button type="button" data-sort="year">Year</button></th>
            <th><button type="button" data-sort="format">Format</button></th>
            <th><button type="button" data-sort="label">Label</button></th>
            <th><button type="button" data-sort="notes">Notes</button></th>
            <th><button type="button" data-sort="added">Added</button></th>
          </tr>
        </thead>
        <tbody id="owned-rows"></tbody>
      </table>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
