name: Find releases

# Lists a record's pressings on MusicBrainz with their cover images, for
# picking a copy's cover in data/edition-covers.csv. Run it from the Actions
# tab (or the API); the list shows in the run's notices.

on:
  workflow_dispatch:
    inputs:
      artist:
        description: Artist
        required: true
      title:
        description: Title
        required: true
      vinyl:
        description: Vinyl releases only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List releases
        env:
          ARTIST: ${{ inputs.artist }}
          TITLE: ${{ inputs.title }}
          VINYL: ${{ inputs.vinyl && '--vinyl' || '' }}
        run: node scripts/find-releases.js "$ARTIST" "$TITLE" $VINYL
