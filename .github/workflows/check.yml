name: Check data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate

  # The lists are the owner's alone: a pull request from anyone else fails
  # this check if it changes anything in data/.
  lists-owner-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block list changes from collaborators
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$AUTHOR" = "$OWNER" ]; then
            echo "Pull request by the owner; list changes allowed."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD -- data/)
          if [ -n "$changed" ]; then
            echo "::error::Only $OWNER can change the lists. This pull request changes:"
            echo "$changed"
            echo "Undo the changes to these files and push again."
            exit 1
          fi
          echo "No list changes."
